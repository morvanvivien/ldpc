name: verify-105
on:
  push:
    branches: [verify-fix-105]
jobs:
  python:
    name: python ${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        variant: [main, pr112, fix, both]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply variant
        run: bash verify/apply.sh ${{ matrix.variant }}
      - name: Build with libstdc++ bounds checks
        env:
          CFLAGS: -D_GLIBCXX_ASSERTIONS
          CXXFLAGS: -D_GLIBCXX_ASSERTIONS
        run: python -m pip install -q . pytest
      - name: Run
        run: bash verify/run_python.sh ${{ matrix.variant }}
  harness:
    name: C++ driver
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and run
        run: bash verify/run_harness.sh
