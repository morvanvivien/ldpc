name: verify-105
on:
  push:
    branches: [verify-fix-105]
jobs:
  python:
    name: python ${{ matrix.variant }} asserts ${{ matrix.asserts }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        variant: [main, pr112, fix, both]
        asserts: ["on"]
        include:
          - variant: main
            asserts: "off"
          - variant: both
            asserts: "off"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply variant
        run: bash verify/apply.sh ${{ matrix.variant }}
      - name: Build
        run: |
          if [ "${{ matrix.asserts }}" = "on" ]; then
            export CFLAGS=-D_GLIBCXX_ASSERTIONS CXXFLAGS=-D_GLIBCXX_ASSERTIONS
          fi
          python -m pip install -q . pytest
      - name: Run
        run: bash verify/run_python.sh ${{ matrix.variant }} ${{ matrix.asserts }}
  harness:
    name: C++ driver
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and run
        run: bash verify/run_harness.sh
